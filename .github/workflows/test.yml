name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same suites before it stages a package.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Cancel superseded pull request runs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # worker/prepare-sdk.sh bundles the pinned ContainerHarness runtime and the container daemon with Bun.
      # Install the pinned Bun release directly and verify its digest, without a third-party action.
      - name: Install Bun
        env:
          BUN_VERSION: 1.3.1
          BUN_SHA256: 400824c82bfcc0854365bcada11cf53d7384ecb1e2c3da0e2c0a2c6a527d5629
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/bun-linux-x64/bun" --version
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: worker/checkout/go.mod
          cache: false
      - name: Install the CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the Worker
        working-directory: worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild the pinned ContainerHarness and the container daemon
        working-directory: worker
        run: bash prepare-sdk.sh
      - name: CLI tests
        run: npm test
      - name: Worker tests
        working-directory: worker
        run: npm test
      - name: Vitest qualification helper tests
        working-directory: worker/qualification/vitest
        run: node --test registry.test.mjs witness.test.mjs
      - name: Checkout helper tests (Go)
        working-directory: worker/checkout
        run: go test ./...
